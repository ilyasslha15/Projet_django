{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h2>➕ Ajouter Type Engin</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

            Enregistrer

    </form>

</div>

{% endblock %}
