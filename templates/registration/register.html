<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RescueTrack – Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body{background:#0f1117;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
        .card{background:#1a1d27;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;}
        .logo-wrap{text-align:center;margin-bottom:24px;}
        .logo-icon{width:56px;height:56px;background:#e63946;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px;}
        h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px;}
        .sub{font-size:13px;color:#6c757d;}
        label{font-size:13px;color:#aaa;font-weight:500;margin-bottom:4px;display:block;}
        input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#fff;border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;transition:all .2s;}
        input:focus{border-color:#e63946;background:rgba(230,57,70,0.05);box-shadow:0 0 0 3px rgba(230,57,70,0.15);}
        input::placeholder{color:#555;}
        .btn-reg{background:#e63946;color:#fff;border:none;border-radius:8px;padding:11px;width:100%;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
        .btn-reg:hover{background:#c1121f;}
        .login-link{text-align:center;margin-top:18px;font-size:13px;color:#6c757d;}
        .login-link a{color:#e63946;text-decoration:none;font-weight:600;}
    </style>
</head>
<body>
<div class="card">
    <div class="logo-wrap">
        <div class="logo-icon">🚒</div>
        <h2>Créer un compte</h2>
        <div class="sub">Rejoignez RescueTrack</div>
    </div>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px">
            <label>Nom d'utilisateur</label>
            {{ form.username }}
        </div>
        <div style="margin-bottom:20px">
            <label>Mot de passe</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn-reg"><i class="bi bi-person-plus"></i> S'inscrire</button>
    </form>
    <div class="login-link">Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></div>
</div>
</body>
</html>
